<template>

    <template if:true={showContent}>

        <lightning-card title={labels.OL_Title}>

            <!-- Spinner -->
            <template if:true={isLoading}>
                <div class="slds-p-around_medium slds-align_absolute-center">
                    <lightning-spinner alternative-text="Chargement"></lightning-spinner>
                </div>
            </template>

            <!-- Erreur quantité -->
            <template if:true={hasQuantityError}>
                <div class="error-box">
                    <p class="error-title">{labels.OL_Error_Title}</p>
                    <p>{labels.OL_Quantity_Error}</p>
                </div>
            </template>

            <!-- Datatable -->
            <template if:true={hasData}>
                <lightning-datatable
                    key-field="Id"
                    data={data}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>

            <!-- Aucun produit -->
            <template if:true={showNoProducts}>
                <div class="no-products">
                    <p><strong>{labels.OL_No_Products}</strong></p>
                    <p>{labels.OL_Select_Pricebook}</p>
                </div>
            </template>

        </lightning-card>

    </template>

    <!-- Non autorisé -->
    <template if:false={showContent}>
        <lightning-card title={labels.OL_Title}>
            <div class="slds-p-around_medium">
                <p>{labels.OL_Not_Authorized}</p>
            </div>
        </lightning-card>
    </template>

</template>
